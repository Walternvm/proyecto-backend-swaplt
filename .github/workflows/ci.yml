name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test with Java 21
    runs-on: ubuntu-latest

    env:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:swaplt;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_SQL_INIT_MODE: never
      JWT_SECRET: github-actions-test-secret-with-at-least-32-characters
      MAIL_SMTP_AUTH: false
      MAIL_STARTTLS_ENABLE: false
      ADMIN_EMAIL: ""
      ADMIN_PASSWORD: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify